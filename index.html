<!DOCTYPE html>
<html>
<head>
    <title>QuickPoll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<canvas id="starfield"></canvas>

<div class="page-wrapper">
    <div class="container">
        <div class="container-scroll">
            <div class="brand">
                <h1>
                    <span class="brand-light">Quick</span>
                    <span class="brand-accent">Poll</span>
                </h1>
                <p>✨ Create & share polls instantly — no sign-up needed ✨</p>
            </div>

            <div id="createSection">
                <input type="text" id="question" placeholder="📝 Enter your question...">
                <div id="optionInputs"></div>

                <button data-action="addOption">➕ Add Option</button>
                <button data-action="createPoll">🚀 Generate Poll</button>
            </div>

            <div id="pollSection">
                <h3 id="pollQuestion"></h3>
                <div id="optionsContainer"></div>

                <div class="share-box">
                    <div><strong>Share Link:</strong></div>
                    <div id="shareLink"></div>
                    <button id="copyBtn" data-action="copyLink">📋 Copy Link</button>
                    <button data-action="shareWhatsApp">💬 WhatsApp</button>
                </div>

                <button data-action="toggleVoters">👥 See Voters</button>
                <div id="votersList"></div>

                <button data-action="resetPoll" data-value="reset">🔄 Reset Poll</button>
                <button data-action="createNewPoll" data-value="new">✨ Create New Poll</button>
            </div>
        </div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>
        <input type="text" id="modalInput" placeholder="Enter your name" style="display:none;">
        <div class="modal-actions">
            <button id="modalCancel">Cancel</button>
            <button id="modalConfirm"></button>
        </div>
    </div>
</div>

<audio id="voteSound">
    <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
